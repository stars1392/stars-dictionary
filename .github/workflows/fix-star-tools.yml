name: Fix Star Tools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-tools:
    if: ${{ !contains(github.event.head_commit.message, '[skip tools-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Star Tools
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('tools.html')
          s = p.read_text(encoding='utf-8')

          light_css = r'''
          /* Light theme */
          body.light{--bg:#f4f7fb;--panel:#ffffff;--panel2:#eef2f8;--text:#172033;--muted:#667085;--border:rgba(15,23,42,.12);--shadow:0 18px 50px rgba(15,23,42,.12);background:radial-gradient(circle at 10% 0,#7667ff16,transparent 30%),radial-gradient(circle at 90% 10%,#00a9cc12,transparent 30%),var(--bg)}
          body.light .top{background:rgba(255,255,255,.88)}
          body.light .calcDisplay{background:#172033;color:#fff}
          body.light .modal{background:rgba(15,23,42,.48)}
          body.light .rate{background:rgba(15,23,42,.035)}
          '''
          if '/* Light theme */' not in s:
              s = s.replace('</style>', light_css + '\n</style>', 1)

          old_theme = "function toggleTheme(){document.body.classList.toggle('light');document.body.classList.toggle('day')}"
          new_theme = r'''function applyTheme(theme){
          document.body.classList.toggle('light',theme==='light');
          localStorage.setItem('star_theme',theme);
          const b=document.querySelector('.nav button');
          if(b)b.textContent=theme==='light'?'☀️ حالت روشن':'🌙 حالت شب';
          }
          function toggleTheme(){applyTheme(document.body.classList.contains('light')?'dark':'light')}
          (function(){const saved=localStorage.getItem('star_theme');applyTheme(saved||'dark')})();'''
          if old_theme in s:
              s = s.replace(old_theme, new_theme, 1)
          else:
              s = re.sub(r"function toggleTheme\(\)\{.*?\}", new_theme, s, count=1)

          currency_block = r'''const rateNames={USD:'دلار آمریکا',EUR:'یورو',GBP:'پوند انگلیس',JPY:'ین ژاپن',CNY:'یوان چین',CAD:'دلار کانادا',AUD:'دلار استرالیا',CHF:'فرانک سوئیس',TRY:'لیر ترکیه',AED:'درهم امارات',SAR:'ریال سعودی',RUB:'روبل روسیه',INR:'روپیه هند',IQD:'دینار عراق',IRR:'ریال ایران'};
          let rates={IRR:1},rateTime='',usdToIrr=0;
          async function loadRates(){
            const statuses=[$('rateStatus'),$('modalRateStatus')].filter(Boolean);
            statuses.forEach(x=>x.textContent='در حال دریافت نرخ‌ها...');
            try{
              const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});
              const d=await r.json();
              if(d.result!=='success'||!d.rates||!d.rates.IRR)throw new Error('IRR unavailable');
              usdToIrr=Number(d.rates.IRR);
              rates={IRR:1};
              Object.keys(rateNames).forEach(c=>{if(c!=='IRR'&&d.rates[c])rates[c]=usdToIrr/Number(d.rates[c])});
              rateTime=new Date(d.time_last_update_utc||Date.now()).toLocaleString('fa-IR');
              renderRates();
              statuses.forEach(x=>x.textContent='آخرین نرخ مرجع: '+rateTime+' | پایه: ریال ایران');
            }catch(e){
              statuses.forEach(x=>x.textContent='دریافت نرخ ناموفق بود؛ اینترنت را بررسی کن.');
            }
          }
          function fmtIRR(v){return Number(v).toLocaleString('fa-IR',{maximumFractionDigits:0})+' ریال'}
          function renderRates(){
            const list=Object.keys(rateNames).map(c=>`<div class="rate"><strong>${c}</strong><small>${rateNames[c]}</small><br><b>${fmtIRR(rates[c]||0)}</b><br><small>۱ واحد ${c} نسبت به ریال</small></div>`).join('');
            if($('rates'))$('rates').innerHTML=list;
            if($('modalRates'))$('modalRates').innerHTML=list;
            if($('modalRateStatus'))$('modalRateStatus').textContent=rateTime?'آخرین نرخ مرجع: '+rateTime+' | پایه: ریال ایران':'هنوز دریافت نشده';
          }
          loadRates();'''
          s = re.sub(r"const rateNames=.*?loadRates\(\);", currency_block, s, count=1, flags=re.S)

          old_money = r"function moneySetup\(\).*?\}\s*function moneyConvert\(\).*?\}\s*const U="
          new_money = r'''function moneySetup(){
          let opts=Object.keys(rateNames).map(c=>`<option value="${c}">${c} — ${rateNames[c]}</option>`).join('');
          $('mcFrom').innerHTML=opts;$('mcTo').innerHTML=opts;$('mcFrom').value='USD';$('mcTo').value='IRR';
          }
          function moneyConvert(){
          let a=Number($('mcAmount').value)||0,f=$('mcFrom').value,t=$('mcTo').value;
          if(!rates[f]||!rates[t])return $('mcResult').textContent='ابتدا نرخ‌ها را دریافت کن';
          $('mcResult').textContent=(a*rates[f]/rates[t]).toLocaleString('fa-IR',{maximumFractionDigits:2})+' '+t;
          }
          const U='''
          s = re.sub(old_money, new_money, s, count=1, flags=re.S)

          p.write_text(s,encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: Star Tools theme and IRR currency rates [skip tools-fix]"
            git push
          fi
