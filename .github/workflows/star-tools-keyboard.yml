name: Star Tools keyboard fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip keyboard-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools.html')
          s=p.read_text(encoding='utf-8')
          marker="document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTool()});"
          add="document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTool();if(e.key==='Enter'&&$('modal').classList.contains('open')&&document.activeElement.tagName!=='TEXTAREA'){let b=document.querySelector('#content [data-primary]');if(b){e.preventDefault();b.click()}}});"
          if marker in s:
              s=s.replace(marker,add,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: Star Tools Enter key [skip keyboard-fix]"
          git push
