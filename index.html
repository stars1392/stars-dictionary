
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star Dictionary</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma, Arial;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#f9d423,#ffcc00);
}


/* Login */

.login-page{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

}


.login-box{

background:white;
width:360px;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 20px 40px #0005;

}


.logo{

font-size:55px;

}


.login-box h1{

color:#d89b00;

}



input,select{

width:100%;
padding:13px;
margin:7px 0;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;

}



button{
    padding:11px 20px;
    border:0;
    border-radius:12px;
    background:#008f83;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{

background:#cc9900;


}


.error{

color:red;

}




/* Main */

#app{

display:none;
padding:25px;

}


.header{

background:white;
border-radius:25px;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 10px 30px #0003;

}


.header h1{

#008f83

}



.container{

display:grid;
grid-template-columns:350px 1fr;
gap:20px;
margin-top:25px;

}


.card{

background:white;
padding:25px;
border-radius:25px;
box-shadow:0 10px 25px #0003;

}



.word{

background:#f5f6ff;
padding:15px;
border-radius:15px;
margin:12px 0;

}


.word h3{

color:#008f83;

}

.word button{

font-size:12px;
padding:7px 12px;

}



@media(max-width:800px){

.container{

grid-template-columns:1fr;

}

}


</style>

</head>


<body>



<div class="login-page" id="login">


<div class="login-box">

<div class="logo">
📚
</div>

<h1>
Star Dictionary
</h1>
	
<p>
Enter Dictionary
</p>


<input 
id="password"
type="password"
placeholder="password"
onkeydown="if(event.key==='Enter') login()">

<button onclick="login()">
Enter
</button>


<p class="error" id="error"></p>


</div>

</div>





<div id="app">


<div class="header">

<h1>
📖 Star Dictionary
</h1>


<button onclick="logout()">
Quit
</button>


</div>




<div class="container">



<div class="card">


<h2>
➕ Add word
</h2>


<input 
id="word"
placeholder="English">


<input 
id="meaning"
placeholder="فارسی">

<input 
id="englishMeaning"
placeholder="English meaning (optional)">

<button onclick="addWord()">
Add
</button>


</div>






<div class="card">


<h2>
🔍 search
</h2>


<input
id="search"
placeholder="search ..."
oninput="searchWord()">



<select id="sort" onchange="sortWords()">

<option value="alpha">
A to Z
</option>


<option value="new">
Date modified
</option>


</select>



<div id="list">

</div>


</div>



</div>



</div>





<script>


let dictionary = JSON.parse(localStorage.getItem("dictionary")) || [

{
word:"book",
meanings:["کتاب","دفتر"],
date:1
},

{
word:"computer",
meanings:["کامپیوتر","رایانه"],
date:2
},

{
word:"football",
meanings:["فوتبال"],
date:3
}

];



function login(){

let pass=
document.getElementById("password").value;


if(pass==="stars1392"){

document.getElementById("login").style.display="none";

document.getElementById("app").style.display="block";

showWords();

}

else{

document.getElementById("error").innerHTML=
"password incorrect";

}

}


function logout(){

location.reload();

}



function save(){

localStorage.setItem(
"dictionary",
JSON.stringify(dictionary)
);

}



// Add word

function addWord(){

let word=document.getElementById("word").value.trim();

let meaning=document.getElementById("meaning").value.trim();



if(word==="" || meaning===""){

alert("Ente word and meanings");
return;

}



let old=dictionary.find(
x=>x.word.toLowerCase()==word.toLowerCase()
);



if(old){

old.meanings.push(meaning);

}

else{


dictionary.push({

word:word,

meanings:[meaning],

date:Date.now()

});


}



save();

showWords();


document.getElementById("word").value="";
document.getElementById("meaning").value="";


}





// show words

function showWords(data=dictionary){


let list=document.getElementById("list");

list.innerHTML="";



data.forEach((item,index)=>{


list.innerHTML+=`

<div class="word">


<h3>
${index + 1} - 📘 ${item.word}
</h3>


<p>
${item.meanings.join(" ، ")}
</p>


<button onclick="editWord(${index})">
✏️ edit
</button>


<button onclick="deleteWord(${index})">
🗑 Delete
</button>


</div>

`;



});


}








// search

function searchWord(){


let text=
document.getElementById("search")
.value
.toLowerCase();



let result=dictionary.filter(item=>{


return (

item.word.toLowerCase()
.includes(text)

||

item.meanings.some(
m=>m.includes(text)
)

);


});


showWords(result);


}






// Delete

function deleteWord(index){


if(confirm("Delete?")){


dictionary.splice(index,1);

save();

showWords();


}


}






// Edit

function editWord(index){


let item=dictionary[index];



let newWord=prompt(
"New word name:",
item.word
);



if(newWord){


let newMeanings=prompt(
"Separate the meanings with , :",
item.meanings.join(",")
);



dictionary[index]={

word:newWord,

meanings:newMeanings.split(","),

date:Date.now()

};



save();

showWords();


}


}








// Sort by

function sortWords(){


let type=
document.getElementById("sort").value;



if(type==="alpha"){


dictionary.sort(
(a,b)=>
a.word.localeCompare(b.word)
);


}

else{


dictionary.sort(
(a,b)=>
b.date-a.date
);


}



showWords();


}



</script>



</body>

</html>back
