name: Repair Star Tools Layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair invalid card HTML
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('tools.html')
          s = p.read_text(encoding='utf-8')

          # The previous edit accidentally put the closing </div> and </button>
          # in the wrong places for tool cards. Restore valid HTML while keeping
          # the card itself clickable and the favorite star as its own button.
          pattern = re.compile(
              r'<div class="toolCard"(?P<head>[^>]*?)>'
              r'<button class="star"(?P<star>[^>]*)>☆</div>'
              r'(?P<body>.*?)</button>',
              re.S
          )

          def repair(m):
              return (
                  '<div class="toolCard"' + m.group('head') + '>'
                  '<button class="star"' + m.group('star') + '>☆</button>'
                  + m.group('body') + '</div>'
              )

          s2, n = pattern.subn(repair, s)
          print(f'Repaired {n} tool cards')
          if n:
              p.write_text(s2, encoding='utf-8')

      - name: Commit repaired page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: repair Star Tools cards [skip ci]"
            git push
          fi

      - name: Remove one-time repair workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-tools-layout.yml || true
          git commit -m "chore: remove one-time repair workflow [skip ci]" || true
          git push || true
