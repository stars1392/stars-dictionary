name: Fix Star Tools UI
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair nested tool card buttons
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('tools.html')
          s=p.read_text(encoding='utf-8')
          # Nested <button> elements are invalid HTML and cause browsers to
          # close the outer card early. Tool cards should be containers.
          s=re.sub(r'<button class="toolCard"([^>]*)>', r'<div class="toolCard"\1>', s)
          s=re.sub(r'(<div class="toolCard"[^\n]*?)</button>', r'\1</div>', s)
          # Keep the favorite control a real button and make the whole card clickable.
          p.write_text(s,encoding='utf-8')
      - name: Add robust card click fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('tools.html')
          s=p.read_text(encoding='utf-8')
          patch='''\n<style>\n.toolCard{cursor:pointer;user-select:none}.toolCard .star{z-index:2}.toolCard:active{transform:scale(.985)}\n</style>\n<script>\ndocument.addEventListener('click',function(e){\n  const card=e.target.closest('.toolCard');\n  if(card && !e.target.closest('.star')){ const id=card.dataset.id; if(id&&typeof openTool==='function') openTool(id); }\n});\n</script>\n'''
          if 'robust card click fallback' not in s:
            s=s.replace('</body>',patch+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair Star Tools cards and buttons [skip ui-fix]'
          git push
